name: Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/dc_ci

      - name: Source regression tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Family template browser QA
        run: node --import tsx scripts/template-browser-qa.mjs

      - name: Upload template review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: family-template-browser
          path: artifacts/template-browser
          if-no-files-found: ignore
          retention-days: 7
